<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History of Digital Humanities - Interactive Timeline</title>
    <meta name="description" content="An interactive timeline of key moments in the digital transformation of humanistic research, from early computing to AI-driven scholarship.">
    <meta property="og:title" content="History of Digital Humanities - Interactive Timeline">
    <meta property="og:description" content="An interactive timeline of key moments in the digital transformation of humanistic research, from early computing to AI-driven scholarship.">
    <meta property="og:type" content="website">
    <link rel="dns-prefetch" href="https://cdn.knightlab.com">
    <link rel="preconnect" href="https://cdn.knightlab.com" crossorigin>
    <link rel="stylesheet" href="styles.css">
    <!-- TimelineJS CSS -->
    <link title="timeline-styles" rel="stylesheet" href="https://cdn.knightlab.com/libs/timeline3/latest/css/timeline.css">
</head>
<body>
    <header class="header">
        <h1>History of Digital Humanities</h1>
        <p class="subtitle">Key Moments in the Digital Transformation of Humanistic Research</p>
    </header>

    <main class="timeline-container">
        <div id="timeline-embed" style="width: 100%; height: 600px"></div>
    </main>

    <footer class="footer">
        <p>Built with <a href="https://timeline.knightlab.com/" target="_blank" rel="noopener noreferrer">TimelineJS</a></p>
    </footer>

    <!-- TimelineJS JavaScript -->
    <script src="https://cdn.knightlab.com/libs/timeline3/latest/js/timeline.js"></script>

    <script>
        // Fallback data for when CSV can't be loaded
        const fallbackData = [
            { year: '1949', headline: "Father Busa's Index Thomisticus", text: "Father Roberto Busa begins creating a computerized concordance of Thomas Aquinas's writings, often considered the birth of humanities computing.", color: '#4a5568' },
            { year: '1966', headline: "Computers and the Humanities Journal", text: "The first academic journal dedicated to computing in humanities research is established, providing a forum for early digital humanists.", color: '#4299e1' },
            { year: '1987', headline: "Text Encoding Initiative Founded", text: "TEI develops standardized guidelines for encoding humanities texts in XML, becoming fundamental infrastructure for digital text analysis.", color: '#48bb78' },
            { year: '1994', headline: "The Victorian Web Launches", text: "One of the first major hypertext scholarly resources, demonstrating the potential of linked digital scholarship beyond print constraints.", color: '#ed8936' },
            { year: '2004', headline: "Google Books Project Announced", text: "Google begins mass digitization of library collections, making millions of books searchable and readable online, sparking debates about copyright and access.", color: '#9f7aea' },
            { year: '2010', headline: "HathiTrust Research Center Opens", text: "Launches providing computational access to millions of digitized volumes for text mining and analysis, enabling large-scale digital humanities research.", color: '#f56565' },
            { year: '2013', headline: "Voyant Tools Reaches Maturity", text: "This web-based text analysis environment becomes widely adopted for exploratory text mining, making computational methods accessible to humanities scholars.", color: '#38b2ac' },
            { year: '2020', headline: "AI Language Models in DH", text: "Large language models like GPT-3 begin being explored for humanities applications including translation, text generation, and historical document analysis.", color: '#667eea' },
            { year: '2024', headline: "Multimodal Digital Scholarship", text: "Integration of text, image, audio, and video analysis using AI, creating new possibilities for cross-media humanities research.", color: '#e53e3e' }
        ];

        // Parse CSV data
        function parseCSV(text) {
            const lines = text.trim().split('\n');
            const headers = lines[0].split(',');
            return lines.slice(1).map(line => {
                const values = line.split(',');
                const obj = {};
                headers.forEach((header, i) => {
                    obj[header.trim()] = values[i]?.trim() || '';
                });
                return obj;
            }).filter(row => row.year); // Filter out empty rows
        }

        function createTimeline(data) {
            // Convert data to TimelineJS format
            const events = data.map(row => ({
                start_date: {
                    year: row.year
                },
                text: {
                    headline: row.headline,
                    text: `<p>${row.text}</p>`
                },
                background: {
                    color: row.color
                }
            }));

            const timelineData = {
                title: {
                    text: {
                        headline: "Digital Humanities Timeline",
                        text: "<p>From early computing experiments to modern data science approaches</p>"
                    }
                },
                events: events
            };

            // Initialize timeline
            window.timeline = new TL.Timeline('timeline-embed', timelineData, {
                initial_zoom: 2,
                timenav_height: 200,
                marker_height_min: 30,
                marker_width_min: 100
            });
        }

        // Load CSV and create timeline
        fetch('timeline-data.csv')
            .then(response => response.text())
            .then(csvText => {
                const rows = parseCSV(csvText);
                createTimeline(rows);
            })
            .catch(error => {
                console.log('CSV file not found, using fallback data');
                // Use fallback data when CSV can't be loaded
                createTimeline(fallbackData);
            });
    </script>
</body>
</html>
