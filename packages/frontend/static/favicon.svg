<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Indigo background circle -->
  <circle cx="32" cy="32" r="32" fill="#6366f1"/>

  <!-- Painter's palette -->
  <path d="M 20 32 C 20 24 25 19 32 19 C 39 19 44 24 44 32 C 44 36 42 39 40 40.5 L 38 42 C 37 42.5 36 42 36 41 C 36 39.5 37 38 37 36.5 C 37 35.5 36 35 35 35.5 C 34 36 34 37 34 38 C 34 39.5 35 41 36.5 42 C 34 43 32 43 30 42.5 C 26 41 24 37 24 32.5 C 24 28 27 25 31 25 C 33 25 35 26 36 27.5 C 37 28.5 38 30 38 32 C 38 33 37.5 34 36.5 34.5 C 35.5 35 34 34.5 34 33.5 C 34 32.5 34.5 31.5 34.5 30.5 C 34.5 29.5 33.5 29 32.5 29.5 C 31.5 30 31 31 31 32 C 31 34 32.5 35.5 34.5 35.5 C 36.5 35.5 38 34 38 32 C 38 29 36 27 33 26 C 29 24.5 25 26.5 23.5 30 C 22.5 32 22 34 22 36 C 22 39.5 24 42.5 27 44 C 28.5 44.8 30 45 31.5 45 C 34 45 36 44 37.5 42.5 C 39 41 40 39 40.5 36.5" fill="#ffffff" opacity="0.2"/>

  <!-- Simple palette shape - cleaner -->
  <ellipse cx="30" cy="33" rx="14" ry="13" fill="#ffffff" opacity="0.95"/>

  <!-- Thumb hole -->
  <ellipse cx="40" cy="40" rx="3.5" ry="4" fill="#6366f1"/>
  <ellipse cx="40" cy="40" rx="2" ry="2.5" fill="#4f46e5"/>

  <!-- Paint colors on palette -->
  <circle cx="25" cy="28" r="2.5" fill="#ef4444"/>
  <circle cx="35" cy="27" r="2.5" fill="#3b82f6"/>
  <circle cx="23" cy="36" r="2.5" fill="#fbbf24"/>
  <circle cx="32" cy="37" r="2.5" fill="#10b981"/>
  <circle cx="30" cy="30" r="2" fill="#a855f7"/>

  <!-- Paintbrush -->
  <g transform="rotate(-40 45 25)">
    <!-- Handle -->
    <rect x="43" y="18" width="2.5" height="14" rx="1.25" fill="#8b5cf6"/>
    <!-- Ferrule -->
    <rect x="42.8" y="30" width="3" height="3" fill="#a78bfa"/>
    <!-- Bristles -->
    <path d="M 43 33 L 42 37 L 46 37 L 45 33 Z" fill="#4f46e5"/>
  </g>
</svg>
