name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CAIL_PACKAGES_TOKEN }}
      - run: bun run verify:repository
      - run: bun run check:dependencies
      - run: bun run test:dependencies
      - run: bun run check
      - name: Validate app Worker bundle and migrations
        run: packages/app/node_modules/.bin/wrangler deploy --dry-run --config packages/app/wrangler.jsonc --outdir .wrangler-dry-run/app
      - name: Validate publisher Worker bundle
        run: packages/worker/node_modules/.bin/wrangler deploy --dry-run --config packages/worker/wrangler.jsonc --outdir .wrangler-dry-run/publisher
