name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Audit high-severity dependencies
        run: bun audit --audit-level=high
      - run: bun run check
      - name: Install Chromium for local browser acceptance
        run: bun run e2e:install:ci
      - name: Run local browser acceptance
        run: bun run e2e:local
      - name: Validate Worker bundle and config
        run: packages/app/node_modules/.bin/wrangler deploy --dry-run --config packages/app/wrangler.jsonc --outdir .wrangler-dry-run/app

  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    concurrency:
      group: site-studio-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Confirm main has not advanced
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          [[ "$current_sha" == "$GITHUB_SHA" ]]
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build the production assets
        run: bun run --cwd packages/app predeploy

      - name: Deploy the exact main commit
        working-directory: packages/app
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          bunx wrangler deploy \
            --strict \
            --tag "$GITHUB_SHA" \
            --message "main $GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Read back the deployed version
        id: version
        working-directory: packages/app
        run: |
          set -euo pipefail
          versions="$(bunx wrangler versions list --name site-studio-app --json 2>/dev/null)"
          version_id="$(jq -r --arg tag "$GITHUB_SHA" --arg message "main $GITHUB_SHA" '
            [ .[]
              | select(.annotations["workers/tag"] == $tag)
              | select(.annotations["workers/message"] == $message)
            ]
            | sort_by(.metadata.created_on)
            | last
            | .id // empty
          ' <<<"$versions")"
          [[ "$version_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          version="$(bunx wrangler versions view "$version_id" --name site-studio-app --json 2>/dev/null)"
          jq -e --arg tag "$GITHUB_SHA" --arg message "main $GITHUB_SHA" '
            .annotations["workers/tag"] == $tag
            and .annotations["workers/message"] == $message
          ' <<<"$version" >/dev/null
          jq -e '
            (.resources.bindings // []) as $bindings |
            ([ $bindings[] | select(.name == "CAIL_API_BASE") ] | length) == 1 and
            ([ $bindings[]
              | select(.name == "CAIL_API_BASE"
                and .type == "plain_text"
                and .text == "https://tools.ailab.gc.cuny.edu")
            ] | length) == 1
          ' <<<"$version" >/dev/null
          deployments="$(bunx wrangler deployments list --name site-studio-app --json 2>/dev/null)"
          deployment_id="$(jq -r --arg id "$version_id" --arg message "main $GITHUB_SHA" '
            [ .[] ]
            | sort_by(.created_on)
            | last
            | select(.annotations["workers/message"] == $message)
            | select((.versions | length) == 1)
            | select(.versions[0].version_id == $id and .versions[0].percentage == 100)
            | .id // empty
          ' <<<"$deployments")"
          [[ "$deployment_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          printf 'version_id=%s\n' "$version_id" >> "$GITHUB_OUTPUT"
          echo "deployed version $version_id"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Read back identity configuration readiness
        working-directory: packages/app
        run: |
          set -euo pipefail
          # Secret values are never read back. The API exposes names only; the
          # presence check catches a release with no verifier key configured.
          secrets="$(bunx wrangler secret list --name site-studio-app --format json 2>/dev/null)"
          jq -e 'any(.[]; .name == "CAIL_IDENTITY_JWKS")' <<<"$secrets" >/dev/null
          echo "CAIL_IDENTITY_JWKS is configured"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Probe production readiness
        env:
          EXPECTED_VERSION_ID: ${{ steps.version.outputs.version_id }}
          HEALTH_URL: https://site-studio-app.ailab-452.workers.dev/site-studio/api/health
          API_URL: https://site-studio-app.ailab-452.workers.dev/site-studio/api/csrf
          DOORWAY_API_URL: https://tools.ailab.gc.cuny.edu/site-studio/api/csrf
          ROOT_URL: https://site-studio-app.ailab-452.workers.dev/site-studio/
        run: |
          set -euo pipefail
          # The deploy API returns before the public Worker route has finished
          # propagating. Poll that real boundary at a two-second cadence for
          # two minutes; stale responses keep polling and a failed final probe
          # fails the deployment job.
          worker_body="$(mktemp)"
          worker_headers="$(mktemp)"
          doorway_body="$(mktemp)"
          doorway_headers="$(mktemp)"
          trap 'rm -f "$worker_body" "$worker_headers" "$doorway_body" "$doorway_headers"' EXIT

          probe_auth_envelope() {
            local url="$1"
            local body="$2"
            local headers="$3"
            local response_status

            response_status="$(curl -sS --max-time 10 -D "$headers" -o "$body" -w '%{http_code}' "$url" || printf '000')"
            if ! [[ "$response_status" == 401 ]]; then
              return 1
            fi
            if ! jq -e '
              .error.code == "authentication_required"
              and .error.message == "Please sign in to continue."
              and .error.launch == "/launch/site-studio"
            ' "$body" >/dev/null 2>&1; then
              return 1
            fi
            if ! grep -iq '^cache-control: no-store' "$headers"; then
              return 1
            fi
          }

          for attempt in $(seq 1 60); do
            health="$(curl -fsS --max-time 10 "$HEALTH_URL" 2>/dev/null || true)"
            if ! jq -e --arg id "$EXPECTED_VERSION_ID" '
              .status == "ok"
              and .product_id == "site-studio"
              and .version_id == $id
            ' <<<"$health" >/dev/null 2>&1; then
              sleep 2
              continue
            fi

            if ! curl -fsS --max-time 10 -o /dev/null "$ROOT_URL"; then
              sleep 2
              continue
            fi

            if probe_auth_envelope "$API_URL" "$worker_body" "$worker_headers" \
              && probe_auth_envelope "$DOORWAY_API_URL" "$doorway_body" "$doorway_headers"; then
              echo "production readiness passed for $EXPECTED_VERSION_ID"
              exit 0
            fi

            sleep 2
          done
          echo "production readiness did not serve the expected version" >&2
          exit 1
